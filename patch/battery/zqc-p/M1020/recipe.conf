# HONOR MagicBook Pro 14 2026 (AI), board M1020.
#
# Same DSDT as M1010 byte for byte, same EC field map (SCRS/TCRS at 0x80/0x81,
# CHMD at 0x85), same three PC Manager presets. What differed was the EC's
# starting state: on BIOS 1.09 and 1.10 out of the box, writing 70-90 through
# the sysfs node (\SBTT) stored the pair and left charge mode 0, so the limit
# was never enforced. One \SBCM call (WMI 0x1503, the request PC Manager makes,
# mode named explicitly) armed it: EC 0x85 read 2, and the battery stopped at
# the ceiling with `Not charging`, tested on 40-70 with the pack charging from
# 65% and halting at exactly 70%. After that first SBCM the EC also started
# arming for plain \SBTT writes of the presets, and that state survived a
# reboot. The installer and the boot/resume unit carry the SBCM fallback, so
# nothing here depends on that state being remembered.
name=EC charge presets
presets=40-70 70-90 95-100
status=verified
origin=this repository, each pair written and read back at EC 0x85; 40-70 enforced physically
